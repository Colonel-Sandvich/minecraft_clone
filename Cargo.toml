[package]
name = "minecraft_clone"
version = "0.1.0"
edition = "2024"

[features]
default = []
turso-store = ["dep:tokio", "dep:turso", "dep:branches"]
# Bevy gates `ScheduleBuildSettings::shuffle_seed` behind its `debug` feature.
# This opt-in feature exposes the env-driven schedule shuffle test switch.
schedule-shuffle = ["bevy/debug"]

[dependencies]
bevy = { version = "0.20.0", features = ["wayland", "dynamic_linking"] }
#NOTE: Disabling bevy/dynamic_linking may improve the performance of this linker (mold).
# Avian 0.8 is not released yet; pin main until the release lands.
avian3d = { git = "https://github.com/avianphysics/avian", rev = "3fb380874552587dfed69f6926145f2093cf7e6d" }
bevy-inspector-egui = { version = "0.38.0" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.0", features = ["rt-multi-thread"], optional = true }
# `turso_core` depends on `branches` without its `std` feature, which makes
# `branches` use `core::intrinsics::abort` — removed in newer nightlies.
# Enabling `std` here unifies the feature and keeps `turso-store` buildable.
branches = { version = "0.4.6", features = ["std"], optional = true }
turso = { version = "0.8.3", default-features = false, optional = true }
strum = { version = "0.28.0", features = ["derive"] }
itertools = "0.15.0"
bevy_shader = "0.20.0"
bevy_mesh = "0.20.0"
bevy-settings = "0.20.0"
bevy_dev_tools = { version = "0.20.0", features = ["render"] }
bytemuck = { version = "1", features = ["derive"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }

[dev-dependencies]
criterion = "0.8.2"
naga = { version = "30.0.0", features = ["wgsl-in"] }
wesl = "0.6.0"
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan", "naga-ir"] }

[[bench]]
name = "light_propagation"
harness = false

[[bench]]
name = "chunk_meshing"
harness = false

[[bench]]
name = "ecs_queries"
harness = false

[[bench]]
name = "vp_gpu_bind_groups"
harness = false


# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
